# Three paid resources. Review Render's current quote before creating them.
# Deployment guide: docs/DEPLOY_RENDER.md
# Schema reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: v9-page-studio
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start-service.sh api
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 90
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: v9-page-db
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_LOGIN_CONFIG_ID
        sync: false
      - key: META_GRAPH_VERSION
        value: v27.0
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: PAGE_INTERVAL_SECONDS
        value: "15"
      - key: SESSION_TTL_DAYS
        value: "7"

  - type: worker
    name: v9-page-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start-service.sh worker
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: PUBLIC_BASE_URL
      - key: DATABASE_URL
        fromDatabase:
          name: v9-page-db
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: TOKEN_ENCRYPTION_KEY
      - key: META_APP_ID
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: META_APP_ID
      - key: META_APP_SECRET
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: META_APP_SECRET
      - key: META_LOGIN_CONFIG_ID
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: META_LOGIN_CONFIG_ID
      - key: META_GRAPH_VERSION
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: META_GRAPH_VERSION
      - key: WORKER_CONCURRENCY
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: WORKER_CONCURRENCY
      - key: PAGE_INTERVAL_SECONDS
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: PAGE_INTERVAL_SECONDS
      - key: SESSION_TTL_DAYS
        fromService:
          type: web
          name: v9-page-studio
          envVarKey: SESSION_TTL_DAYS

databases:
  - name: v9-page-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: v9
    user: v9
    diskSizeGB: 1
    # Keep queue advisory locks on a dedicated PostgreSQL session.
    connectionPool: none
    # Services use Render's private network; no public database access.
    ipAllowList: []
